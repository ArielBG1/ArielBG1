<svg xmlns="http://www.w3.org/2000/svg" width="880" height="228" viewBox="0 0 880 228" role="img" aria-labelledby="t">
<title id="t">Cyclo — Plataforma de economía circular. Rol: Desarrollador full stack · Líder técnico. App ciudadana de reciclaje con mapa, reconocimiento de materiales por cámara y gamificación. Lideré el desarrollo en el Global Green Challenge, junto a INHA University (Corea del Sur). Stack: React, Vite, Tailwind CSS, Node.js, Express, PostgreSQL + PostGIS, TensorFlow.js.</title>
