<svg xmlns="http://www.w3.org/2000/svg" width="880" height="395" viewBox="0 0 880 395" role="img" aria-labelledby="t">
<title id="t">GET /experiencia — Software Developer, Universidad de la Integración de las Américas (UNIDA) (Abril 2024 – Presente). Desarrollo y mantengo la plataforma universitaria en C# con ASP.NET MVC y ASP.NET Core (.NET 10). Construyo módulos y APIs REST a medida, desde el modelado de datos hasta la integración con otros sistemas. Modelo bases de datos en SQL Server y optimizo el acceso a datos con consultas SQL y LINQ. Relevo requerimientos, planifico las tareas del equipo de desarrollo y reviso las entregas.</title>
