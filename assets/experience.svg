<svg xmlns="http://www.w3.org/2000/svg" width="880" height="717" viewBox="0 0 880 717" role="img" aria-labelledby="t">
<title id="t">GET /experiencia — Software Developer, Universidad de la Integración de las Américas (UNIDA) (Abril 2024 – Presente). Desarrollo: Desarrollo nuevas funcionalidades y realizo el mantenimiento de la plataforma universitaria en C# con ASP.NET MVC y ASP.NET Core (.NET 10). Construyo módulos y APIs REST a medida para distintas áreas de la universidad, desde el modelado de datos hasta la integración con otros sistemas. Modelo bases de datos en SQL Server y optimizo el acceso a datos mediante consultas SQL y LINQ. Diagnostico y corrijo incidencias en producción, y automatizo procesos internos para reducir tareas manuales. Liderazgo y análisis: Relevo requerimientos con las distintas áreas de la universidad, los analizo y defino el alcance de cada desarrollo. Planifico y distribuyo las tareas del equipo de desarrollo según prioridades, bajo la supervisión de la Jefatura de Sistemas. Reviso el trabajo entregado por el equipo y hago seguimiento del cumplimiento de plazos. Valido las entregas con los usuarios y elaboro documentación técnica de los sistemas.</title>
