  <text x="26" y="277" class="mono brand" font-size="11.5" font-weight="600" letter-spacing="1.2"># DESARROLLO</text><text x="26" y="307" class="mono" font-size="12">01</text><text x="56" y="307" class="mono ok" font-size="12">INFO</text><text x="108" y="307" class="fg" font-size="13.5" font-weight="400">Desarrollo nuevas funcionalidades y realizo el mantenimiento de la plataforma universitaria en C# con ASP.NET</text><text x="108" y="328" class="fg" font-size="13.5" font-weight="400">MVC y ASP.NET Core (.NET 10).</text><text x="26" y="359" class="mono" font-size="12">02</text><text x="56" y="359" class="mono ok" font-size="12">INFO</text><text x="108" y="359" class="fg" font-size="13.5" font-weight="400">Construyo módulos y APIs REST a medida para distintas áreas de la universidad, desde el modelado de datos</text><text x="108" y="380" class="fg" font-size="13.5" font-weight="400">hasta la integración con otros sistemas.</text><text x="26" y="411" class="mono" font-size="12">03</text><text x="56" y="411" class="mono ok" font-size="12">INFO</text><text x="108" y="411" class="fg" font-size="13.5" font-weight="400">Modelo bases de datos en SQL Server y optimizo el acceso a datos mediante consultas SQL y LINQ.</text><text x="26" y="442" class="mono" font-size="12">04</text><text x="56" y="442" class="mono ok" font-size="12">INFO</text><text x="108" y="442" class="fg" font-size="13.5" font-weight="400">Diagnostico y corrijo incidencias en producción, y automatizo procesos internos para reducir tareas manuales.</text><text x="26" y="491" class="mono brand" font-size="11.5" font-weight="600" letter-spacing="1.2"># LIDERAZGO Y ANÁLISIS</text><text x="26" y="521" class="mono" font-size="12">05</text><text x="56" y="521" class="mono ok" font-size="12">INFO</text><text x="108" y="521" class="fg" font-size="13.5" font-weight="400">Relevo requerimientos con las distintas áreas de la universidad, los analizo y defino el alcance de cada</text><text x="108" y="542" class="fg" font-size="13.5" font-weight="400">desarrollo.</text><text x="26" y="573" class="mono" font-size="12">06</text><text x="56" y="573" class="mono ok" font-size="12">INFO</text><text x="108" y="573" class="fg" font-size="13.5" font-weight="400">Planifico y distribuyo las tareas del equipo de desarrollo según prioridades, bajo la supervisión de la</text><text x="108" y="594" class="fg" font-size="13.5" font-weight="400">Jefatura de Sistemas.</text><text x="26" y="625" class="mono" font-size="12">07</text><text x="56" y="625" class="mono ok" font-size="12">INFO</text><text x="108" y="625" class="fg" font-size="13.5" font-weight="400">Reviso el trabajo entregado por el equipo y hago seguimiento del cumplimiento de plazos.</text><text x="26" y="656" class="mono" font-size="12">08</text><text x="56" y="656" class="mono ok" font-size="12">INFO</text><text x="108" y="656" class="fg" font-size="13.5" font-weight="400">Valido las entregas con los usuarios y elaboro documentación técnica de los sistemas.</text>
